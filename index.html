<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Word Dungeon: S.2 Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1a20;
            --panel-color: #2d2d38;
            --text-main: #fff;
            --syn-color: #66bb6a;
            --ant-color: #ef5350;
            --boss-color: #ab47bc;
            --accent: #fbc02d;
        }

        body {
            background-color: #000;
            font-family: 'Press Start 2P', cursive;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* 禁止手機滾動 */
            touch-action: manipulation; /* 優化觸控 */
        }

        #game-container {
            width: 100%;
            max-width: 500px; /* 回歸手機適合寬度 */
            height: 100vh;    /* 佔滿手機全屏 */
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 頂部資訊欄 */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #222;
            padding: 10px;
            border-bottom: 2px solid #555;
            font-size: 12px;
            height: 40px;
        }

        .hp-bar-outer {
            width: 100px;
            height: 12px;
            background: #555;
            border: 2px solid #fff;
            display: inline-block;
            vertical-align: middle;
            margin-left: 5px;
        }

        .hp-bar-inner {
            width: 100%;
            height: 100%;
            background: #ff3333;
            transition: width 0.3s;
        }

        /* 戰鬥主畫面 */
        .battle-stage {
            flex-grow: 1;
            background: #15151a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background-image: radial-gradient(circle, #333 1px, transparent 1px);
            background-size: 20px 20px;
            padding: 10px;
        }

        /* Boss 模式特效 */
        .boss-mode .battle-stage {
            background: #2a002a;
            border: 2px solid var(--boss-color);
        }

        .monster-emoji {
            font-size: 80px;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
            transition: transform 0.2s;
        }

        .monster-word {
            font-size: 28px;
            color: var(--accent);
            text-transform: uppercase;
            text-shadow: 2px 2px #000;
            margin: 5px 0;
            text-align: center;
        }

        /* 例句 (針對手機優化字體) */
        .monster-sentence {
            font-family: 'Roboto', sans-serif;
            font-size: 16px;
            color: #ccc;
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 15px;
            margin-bottom: 10px;
            text-align: center;
            line-height: 1.4;
            max-width: 90%;
        }

        .task-badge {
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 5px;
            color: #000;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 10px;
        }

        /* Boss 血條 */
        .boss-hp-container {
            width: 80%;
            height: 8px;
            background: #333;
            margin-top: 5px;
            border-radius: 4px;
            display: none;
        }
        .boss-hp-fill {
            width: 100%;
            height: 100%;
            background: var(--boss-color);
            transition: width 0.3s;
        }

        /* 選項按鈕區 */
        .options-grid {
            display: flex;
            flex-direction: column; /* 手機版改為垂直排列，防誤觸 */
            gap: 10px;
            padding: 15px;
            background: #222;
        }

        button {
            background-color: var(--panel-color);
            color: white;
            border: 2px solid #666;
            border-radius: 8px;
            font-family: 'Press Start 2P', cursive;
            font-size: 14px;
            padding: 15px;
            cursor: pointer;
            text-transform: uppercase;
            text-align: center; /* 文字置中 */
        }

        button:active {
            transform: scale(0.98);
        }
        
        button:disabled {
            opacity: 0.5;
        }

        /* 反饋特效 */
        .feedback-overlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            font-weight: bold;
            text-shadow: 3px 3px 0 #000;
            pointer-events: none;
            display: none;
            z-index: 100;
        }

        .shake { animation: shake 0.4s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .hit-effect { animation: damage 0.2s; }
        @keyframes damage {
            0% { filter: brightness(1); transform: scale(1); }
            50% { filter: brightness(5) sepia(1); transform: scale(0.9); }
            100% { filter: brightness(1); transform: scale(1); }
        }

        /* 覆蓋層 */
        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .start-btn {
            padding: 15px 30px;
            font-size: 18px;
            background: var(--syn-color);
            border: none;
            color: #000;
            margin-top: 20px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

    </style>
</head>
<body>

<div id="game-container">
    <div id="feedback" class="feedback-overlay">HIT!</div>

    <div class="hud">
        <div>LV: <span id="level-num">1</span></div>
        <div>SCORE: <span id="score-num" style="color:gold">0</span></div>
        <div style="display:flex; align-items:center;">
            HP
            <div class="hp-bar-outer">
                <div class="hp-bar-inner" id="player-hp"></div>
            </div>
        </div>
    </div>

    <div class="battle-stage" id="stage">
        <div class="monster-emoji" id="m-emoji">🦇</div>
        <div class="monster-word" id="m-word">Word</div>
        <div class="monster-sentence" id="m-sentence">Sentence here.</div>
        
        <div class="boss-hp-container" id="boss-hp-bar">
            <div class="boss-hp-fill" id="boss-hp-fill"></div>
        </div>

        <div style="flex-grow:1"></div>
        <div class="task-badge" id="task-badge">Target</div>
    </div>

    <div class="options-grid" id="options-box">
        </div>

    <div id="start-screen" class="overlay-screen">
        <h1 style="color:var(--accent); font-size:30px; line-height:1.5;">WORD DUNGEON<br>MOBILE</h1>
        <p style="color:#aaa; margin-top:10px; font-size:12px;">Tap buttons to answer.<br>Turn on volume!</p>
        <button class="start-btn" onclick="initGame()">START GAME</button>
    </div>

    <div id="end-screen" class="overlay-screen" style="display:none;">
        <h1 style="color:var(--ant-color)">GAME OVER</h1>
        <p>Final Score: <span id="final-score">0</span></p>
        <button class="start-btn" onclick="initGame()">PLAY AGAIN</button>
    </div>
    
    <div id="win-screen" class="overlay-screen" style="display:none;">
        <h1 style="color:gold">YOU WON!</h1>
        <p>You mastered all words!</p>
        <p>Score: <span id="win-score">0</span></p>
        <button class="start-btn" onclick="initGame()">RESTART</button>
    </div>
</div>

<script>
    // --- 1. 擴充後的字庫 (40 Words) ---
    // 包含 Synonym (同義) 和 Antonym (反義)
    // 難度：Secondary 2 Weak (Foundation)
    
    const db = [
        // --- Antonyms (Opposites) - RED ---
        { word: "EXPENSIVE", type: "ant", answer: "Cheap", sentence: "I don't have much money. I need a ______ bag.", distractors: ["Costly", "Rich"], emoji: "🦇" },
        { word: "DANGEROUS", type: "ant", answer: "Safe", sentence: "Don't play with fire! It is not ______.", distractors: ["Scary", "Bad"], emoji: "🦁" },
        { word: "SIMPLE", type: "ant", answer: "Complex", sentence: "This puzzle is not ______. It is very hard.", distractors: ["Easy", "Short"], emoji: "🕷️" },
        { word: "VICTORY", type: "ant", answer: "Defeat", sentence: "We won the game! It was a great ______.", distractors: ["Win", "Loss"], emoji: "👺" },
        { word: "ANCIENT", type: "ant", answer: "Modern", sentence: "This phone is new and ______, not old.", distractors: ["Old", "Fresh"], emoji: "🧟" },
        { word: "SHARP", type: "ant", answer: "Blunt", sentence: "This knife cannot cut. It is ______.", distractors: ["Pointy", "Keen"], emoji: "🦂" },
        { word: "EMPTY", type: "ant", answer: "Full", sentence: "The glass has water inside. It is ______.", distractors: ["Hollow", "Clean"], emoji: "👻" },
        { word: "PUNISH", type: "ant", answer: "Reward", sentence: "If you do well, I will ______ you.", distractors: ["Hit", "Scold"], emoji: "👮" },
        { word: "ARRIVE", type: "ant", answer: "Leave", sentence: "We just got here. Please don't ______.", distractors: ["Come", "Stay"], emoji: "✈️" },
        { word: "TIGHT", type: "ant", answer: "Loose", sentence: "These pants are too big. They are ______.", distractors: ["Small", "Fit"], emoji: "👖" },
        { word: "FRIEND", type: "ant", answer: "Enemy", sentence: "He is not my friend. He is my ______.", distractors: ["Buddy", "Pal"], emoji: "🦹" },
        { word: "INCREASE", type: "ant", answer: "Decrease", sentence: "Sales did not go up. They started to ______.", distractors: ["Grow", "Add"], emoji: "📉" },
        { word: "ADMIT", type: "ant", answer: "Deny", sentence: "He did not say yes. He tried to ______ it.", distractors: ["Accept", "Allow"], emoji: "🙅" },
        { word: "SMOOTH", type: "ant", answer: "Rough", sentence: "The road is not flat. It is very ______.", distractors: ["Soft", "Clean"], emoji: "⛰️" },
        { word: "MEND", type: "ant", answer: "Break", sentence: "Don't fix it. Just ______ it!", distractors: ["Repair", "Sew"], emoji: "🔨" },
        { word: "PRIVATE", type: "ant", answer: "Public", sentence: "This park is for everyone. It is ______.", distractors: ["Secret", "Closed"], emoji: "🏞️" },
        { word: "STRENGTHEN", type: "ant", answer: "Weaken", sentence: "The illness will not make me strong. It will ______ me.", distractors: ["Power", "Build"], emoji: "🦠" },
        { word: "TEMPORARY", type: "ant", answer: "Permanent", sentence: "This tattoo is not for a day. It is ______.", distractors: ["Short", "Brief"], emoji: "⏳" },
        { word: "GUILTY", type: "ant", answer: "Innocent", sentence: "He did not steal the money. He is ______.", distractors: ["Bad", "Wrong"], emoji: "😇" },
        { word: "CREATE", type: "ant", answer: "Destroy", sentence: "Don't build it. You should ______ it.", distractors: ["Make", "Form"], emoji: "💥" },

        // --- Synonyms (Same meaning) - GREEN ---
        { word: "ENORMOUS", type: "syn", answer: "Huge", sentence: "The elephant is ______. It is very big.", distractors: ["Tiny", "Small"], emoji: "🦖" },
        { word: "TERRIFIED", type: "syn", answer: "Scared", sentence: "He saw a ghost and was ______.", distractors: ["Brave", "Happy"], emoji: "😱" },
        { word: "WEALTHY", type: "syn", answer: "Rich", sentence: "He has a lot of money. He is ______.", distractors: ["Poor", "Sad"], emoji: "🤑" },
        { word: "SELECT", type: "syn", answer: "Choose", sentence: "Please ______ the best answer.", distractors: ["Refuse", "Stop"], emoji: "🦎" },
        { word: "RESCUE", type: "syn", answer: "Save", sentence: "The fireman helped to ______ the cat.", distractors: ["Hurt", "Drop"], emoji: "⛑️" },
        { word: "DIFFICULT", type: "syn", answer: "Hard", sentence: "This test is not easy. It is ______.", distractors: ["Soft", "Simple"], emoji: "🐢" },
        { word: "ANNUAL", type: "syn", answer: "Yearly", sentence: "My birthday is an ______ event.", distractors: ["Daily", "Weekly"], emoji: "📅" },
        { word: "ALLOW", type: "syn", answer: "Let", sentence: "Please ______ me go to the toilet.", distractors: ["Stop", "Ban"], emoji: "🚥" },
        { word: "COMPLETED", type: "syn", answer: "Finished", sentence: "I have ______ my homework.", distractors: ["Started", "Opened"], emoji: "✅" },
        { word: "VANISH", type: "syn", answer: "Disappear", sentence: "The ghost seemed to ______ into thin air.", distractors: ["Show", "Appear"], emoji: "💨" },
        { word: "GENUINE", type: "syn", answer: "Real", sentence: "This is not fake. It is ______ gold.", distractors: ["False", "Lie"], emoji: "💍" },
        { word: "OBTAIN", type: "syn", answer: "Get", sentence: "I need to ______ a ticket first.", distractors: ["Lose", "Give"], emoji: "🎫" },
        { word: "RAPID", type: "syn", answer: "Fast", sentence: "The train is very ______. It is quick.", distractors: ["Slow", "Late"], emoji: "🚄" },
        { word: "OBSERVE", type: "syn", answer: "Watch", sentence: "The scientist likes to ______ the stars.", distractors: ["Ignore", "Miss"], emoji: "🔭" },
        { word: "MISTAKE", type: "syn", answer: "Error", sentence: "I wrote the wrong answer. It was a ______.", distractors: ["Fact", "Truth"], emoji: "❌" },
        { word: "OPPORTUNITY", type: "syn", answer: "Chance", sentence: "This is a good ______ to learn.", distractors: ["Problem", "Bad"], emoji: "🍀" },
        { word: "ACCURATE", type: "syn", answer: "Correct", sentence: "Your answer is ______. Good job!", distractors: ["Wrong", "False"], emoji: "🎯" },
        { word: "CONSUME", type: "syn", answer: "Eat", sentence: "People ______ a lot of food everyday.", distractors: ["Play", "Make"], emoji: "🍔" },
        { word: "SUFFICIENT", type: "syn", answer: "Enough", sentence: "We have ______ food for everyone.", distractors: ["Little", "No"], emoji: "🍱" },
        { word: "VACATION", type: "syn", answer: "Holiday", sentence: "I am going on ______ to Japan.", distractors: ["Work", "School"], emoji: "🏖️" }
    ];

    let state = {
        hp: 100,
        score: 0,
        level: 1,
        waveCount: 0, 
        isBoss: false,
        bossHP: 3,
        currentQ: null,
        pool: []
    };

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // 停止上一句
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.8; 
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }
    }

    function initGame() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('end-screen').style.display = 'none';
        document.getElementById('win-screen').style.display = 'none';
        
        state.hp = 100;
        state.score = 0;
        state.level = 1;
        state.waveCount = 0;
        state.isBoss = false;
        
        updateHUD();
        resetPool();
        nextTurn();
    }

    function resetPool() {
        // 深拷貝，確保重置時題目完整
        state.pool = JSON.parse(JSON.stringify(db));
    }

    function nextTurn() {
        if (state.hp <= 0) return gameOver();

        // 檢查是否通關 (字庫全空)
        if (state.pool.length === 0 && !state.isBoss) {
            return gameWin();
        }

        // Boss 戰檢查 (每 4 隻怪)
        if (state.waveCount > 0 && state.waveCount % 4 === 0 && !state.isBoss) {
            startBossBattle();
            return;
        }

        // 普通怪
        state.isBoss = false;
        document.getElementById('game-container').classList.remove('boss-mode');
        document.getElementById('boss-hp-bar').style.display = 'none';

        // 隨機抽取並不放回 (No Repeat Logic)
        const idx = Math.floor(Math.random() * state.pool.length);
        state.currentQ = state.pool[idx];
        
        // 從池中移除該題，確保不會重複
        state.pool.splice(idx, 1);

        renderTurn();
    }

    function startBossBattle() {
        state.isBoss = true;
        state.bossHP = 3; 
        
        document.getElementById('game-container').classList.add('boss-mode');
        document.getElementById('boss-hp-bar').style.display = 'block';
        updateBossHP();
        
        generateBossQuestion();
    }

    function generateBossQuestion() {
        // Boss 戰直接從原始 DB 隨機抽一題 (因為 Boss 需要連續出題，可能會用到已刪除的題目，這可以接受)
        // 為了不讓 Boss 戰消耗剩餘題目太快，這裡不從 pool 移除，而是從 db 隨機取
        // 或者：如果希望 Boss 也完全不重複，就要檢查 pool 剩餘量。
        // 策略：Boss 題目可重複，作為「複習」。
        const randomQ = db[Math.floor(Math.random() * db.length)];
        state.currentQ = randomQ;
        renderTurn(true);
    }

    function renderTurn(isBossRender = false) {
        const q = state.currentQ;
        
        document.getElementById('m-emoji').innerText = isBossRender ? "🐲" : q.emoji;
        document.getElementById('m-word').innerText = q.word;
        document.getElementById('m-sentence').innerText = q.sentence;

        const badge = document.getElementById('task-badge');
        if (q.type === 'syn') {
            badge.innerText = "Target: SYNONYM (Same)";
            badge.style.background = "var(--syn-color)";
        } else {
            badge.innerText = "Target: ANTONYM (Opposite)";
            badge.style.background = "var(--ant-color)";
        }

        speak(q.word);

        const box = document.getElementById('options-box');
        box.innerHTML = '';
        
        let choices = [q.answer, ...q.distractors];
        choices.sort(() => Math.random() - 0.5); 

        choices.forEach(c => {
            const btn = document.createElement('button');
            btn.innerText = c;
            btn.onclick = () => handleInput(c, btn);
            box.appendChild(btn);
        });
    }

    function handleInput(choice, btn) {
        const isCorrect = (choice === state.currentQ.answer);

        if (isCorrect) {
            showFeedback("HIT!", "gold");
            document.getElementById('m-emoji').classList.add('hit-effect');
            
            // Lock buttons
            Array.from(document.querySelectorAll('button')).forEach(b => b.disabled = true);

            if (state.isBoss) {
                state.bossHP--;
                updateBossHP();
                state.score += 200;
                
                if (state.bossHP <= 0) {
                    setTimeout(() => {
                        state.waveCount++; 
                        state.isBoss = false;
                        state.level++; 
                        nextTurn();
                    }, 1000);
                } else {
                    setTimeout(() => {
                        generateBossQuestion();
                    }, 1000);
                }
            } else {
                state.score += 100;
                state.waveCount++;
                setTimeout(nextTurn, 800);
            }

        } else {
            state.hp -= 20; // 扣血
            showFeedback("MISS!", "red");
            document.getElementById('stage').classList.add('shake');
            btn.style.backgroundColor = "#552222";
            btn.disabled = true;
            
            if (state.hp <= 0) {
                setTimeout(gameOver, 500);
            } else {
                setTimeout(() => {
                    document.getElementById('stage').classList.remove('shake');
                }, 500);
            }
        }
        updateHUD();
    }

    function showFeedback(text, color) {
        const fb = document.getElementById('feedback');
        fb.innerText = text;
        fb.style.color = color;
        fb.style.display = 'block';
        setTimeout(() => { fb.style.display = 'none'; }, 500);
    }

    function updateHUD() {
        document.getElementById('score-num').innerText = state.score;
        document.getElementById('level-num').innerText = state.level;
        document.getElementById('player-hp').style.width = state.hp + "%";
    }

    function updateBossHP() {
        const fill = document.getElementById('boss-hp-fill');
        const pct = (state.bossHP / 3) * 100;
        fill.style.width = pct + "%";
    }

    function gameOver() {
        document.getElementById('end-screen').style.display = 'flex';
        document.getElementById('final-score').innerText = state.score;
    }

    function gameWin() {
        document.getElementById('win-screen').style.display = 'flex';
        document.getElementById('win-score').innerText = state.score;
    }

</script>
</body>
</html>
